<script>
const D = JSON.parse(document.getElementById('dash-data').textContent);
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vClass = {better:'better', 'on-par':'onpar', worse:'worse'};
const vTitle = {better:'You are beating industry standard', 'on-par':'You are on par with industry standard', worse:'You are below industry standard'};
let chart = null;

if (!D.runs || D.runs.length === 0) {
  app.innerHTML = `
    <div class="verdict empty"><h2>Dashboard armed, waiting for first check</h2>
    <p>First run pulls your campaign data from LinkedIn Campaign Manager, compares it to current industry benchmarks, and fills every section below.</p></div>
    <div class="sec"><div class="emptystate"><div class="big">&#128225;</div>
    Next check runs at 10:00 AM or 4:00 PM, whichever comes first.<br>
    Keep the Claude app and Chrome (logged into LinkedIn) open at those times.</div></div>`;
} else {
  const runs = D.runs;
  const lastIdx = runs.length - 1;

  // version selector (newest first), latest selected by default
  const opts = runs.map((r,i)=>({i,r})).reverse()
    .map(({i,r})=>`<option value="${i}"${i===lastIdx?' selected':''}>${esc(r.ts)} &middot; ${esc((r.verdict||'').toUpperCase())}${i===lastIdx?' (latest)':''}</option>`).join('');
  app.innerHTML = `
    <div class="runbar">
      <label for="runsel">Version</label>
      <select id="runsel" aria-label="Select which check to view">${opts}</select>
      <span class="runcount">${runs.length} check${runs.length>1?'s':''} logged</span>
    </div>
    <div id="runbody"></div>`;
  const sel = document.getElementById('runsel');
  const body = document.getElementById('runbody');

  function renderRun(idx){
    const r = runs[idx];
    const isLatest = idx === lastIdx;
    document.getElementById('updated').textContent = (isLatest ? 'Last updated: ' + (D.updatedAt || r.ts) : 'Viewing earlier check: ' + r.ts);

    let html = `<div class="verdict ${vClass[r.verdict]||'onpar'}"><h2>${vTitle[r.verdict]||'Status'}${isLatest?'':' <span class="viewing">archived check</span>'}</h2><p>${esc(r.verdictNote)}</p></div>`;

    html += `<div class="sec urgent"><h3><span class="ico">&#128680;</span>Immediate attention needed</h3><ul>`;
    html += (r.urgent && r.urgent.length) ? r.urgent.map(x=>`<li>${esc(x)}</li>`).join('') : `<li class="none" style="border:none">Nothing urgent right now.</li>`;
    html += `</ul></div>`;

    html += `<div class="grid">` + (r.metrics||[]).map(m=>`
      <div class="card">
        <div class="mname"><span class="dot ${m.status}"></span>${esc(m.name)}</div>
        <div class="mval">${esc(m.value)}</div>
        <div class="mdelta ${m.status}">${esc(m.delta||'')}</div>
        <div class="mmean">${esc(m.meaning)}</div>
        <div class="mbench">Benchmark: ${esc(m.benchmark||'n/a')}</div>
      </div>`).join('') + `</div>`;

    if (D.history && D.history.length > 1) {
      html += `<div class="chartbox"><h3>&#128200; Trend across all checks: open rate &amp; click-to-open</h3><div class="chartwrap"><canvas id="trend"></canvas></div></div>`;
    }

    const p = r.prediction || {};
    const callClass = (p.call||'hold').toLowerCase();
    const callText = {win:'&#127942; ON TRACK TO WIN', pivot:'&#8620; TIME TO PIVOT', hold:'&#9203; HOLD &amp; WATCH'}[callClass] || esc(p.call);
    html += `<div class="pred"><h3>&#128302; Win or pivot forecast</h3>
      <div class="call ${callClass}">${callText}</div>
      <p><strong>${esc(p.when||'')}</strong> ${p.when?'&middot; ':''}Confidence: ${esc(p.confidence||'low')}</p>
      <p>${esc(p.note)}</p></div>`;

    html += `<div class="sec improve"><h3><span class="ico">&#128295;</span>What can be improved</h3><ul>`;
    html += (r.improve && r.improve.length) ? r.improve.map(x=>`<li>${esc(x)}</li>`).join('') : `<li class="none" style="border:none">No suggestions this run.</li>`;
    html += `</ul></div>`;

    html += `<div class="sec stop"><h3><span class="ico">&#128721;</span>Stop immediately</h3><ul>`;
    html += (r.stop && r.stop.length) ? r.stop.map(x=>`<li>${esc(x)}</li>`).join('') : `<li class="none" style="border:none">Nothing needs to be killed right now.</li>`;
    html += `</ul></div>`;

    body.innerHTML = html;

    if (D.history && D.history.length > 1) {
      if (chart) { chart.destroy(); chart = null; }
      chart = new Chart(document.getElementById('trend'), {
        type: 'line',
        data: {
          labels: D.history.map(h=>h.date),
          datasets: [
            { label:'Open rate %', data:D.history.map(h=>h.openRate), borderColor:'#d97706', backgroundColor:'rgba(217,119,6,.08)', tension:.3, yAxisID:'y' },
            { label:'Click-to-open %', data:D.history.map(h=>h.ctr), borderColor:'#2563eb', backgroundColor:'rgba(37,99,235,.08)', tension:.3, yAxisID:'y' },
            { label:'Leads', data:D.history.map(h=>h.leads), borderColor:'#059669', backgroundColor:'rgba(5,150,105,.08)', tension:.3, yAxisID:'y1' }
          ]
        },
        options: { responsive:true, maintainAspectRatio:false,
          scales: { y:{position:'left', title:{display:true,text:'Rate %'}}, y1:{position:'right', grid:{drawOnChartArea:false}, title:{display:true,text:'Leads'}, ticks:{precision:0} } },
          plugins: { legend:{labels:{boxWidth:12,font:{size:11}}} } }
      });
    }
  }

  renderRun(lastIdx);
  sel.addEventListener('change', e => renderRun(parseInt(e.target.value, 10)));
}
</script>
